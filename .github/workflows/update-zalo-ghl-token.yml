name: Update ZALO & GHL Tokens Every 20 Hours

on:
  schedule:
    - cron: '0 */20 * * *'  # Chạy mỗi 20 giờ
  workflow_dispatch:        # Cho phép chạy thủ công

permissions:
  contents: write

jobs:
  update-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 📄 Load current .env from Git
        run: git checkout origin/main -- .env

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔁 Update ZALO tokens
        run: node update-zalo-token.js

      - name: 🔁 Update GHL tokens
        run: node update-ghl-token.js

      - name: ✅ Commit & push updated .env (after both updates)
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .env
          git diff --cached --quiet || git commit -m "🔁 Update ZALO & GHL tokens"
          git pull --rebase origin main
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
