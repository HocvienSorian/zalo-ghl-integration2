name: Update GHL Tokens Every 20 Hours

on:
  schedule:
    - cron: '0 */20 * * *' # chạy mỗi 20 giờ
  workflow_dispatch: # cho phép chạy thủ công

permissions:
  contents: write

jobs:
  update-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run update-ghl-token.js
        run: node update-ghl-token.js

      - name: Commit and push updated .env
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add .env
          git commit -m "🔁 Update GHL tokens" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
